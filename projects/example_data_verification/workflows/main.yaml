id: example_data_verification
name: Example Data Verification
version: "0.1.0"
type: excel
description: YAML workflow descriptor for projects/example_data_verification/workflows/main.yaml.
owner: ops
target_systems:
  - fixture-system
input_schema:
  input_excel: string
output_destination: reports/output.xlsx
system_of_record: fixture-system
success_condition: The workflow writes mismatch evidence for processed records.
safe_test_case: Run against fixture rows only.
allowed_side_effects:
  - write_report
rerun_policy: Safe for fixture rows; check output workbook before production use.
escalation_owner: ops
inputs:
  input_excel: ./data/input.xlsx
  output_excel: ./reports/output.xlsx
steps:
  - id: yaml_descriptor_entrypoint
    current_stage: audit_yaml_descriptor
    intent: Run the project YAML workflow.
    preconditions:
      - config.yaml points to local fixture files
    postconditions:
      - report workbook exists
    proof: python main.py --audit-workflow projects/example_data_verification/workflows/main.yaml
    failure_path: Fix the YAML descriptor before production execution.
    action:
      type: no_op
    success_check:
      - type: always_pass
