id: rpa_challenge_public_form
name: RPA Challenge Public Form
version: '1.0'
type: browser
description: Fill the public RPA Challenge form using stable label-backed Angular field attributes. Generated from the provided
  challenge spreadsheet.
owner: Rau
target_systems:
- rpachallenge.com
input_schema:
  records: 10 non-empty rows from challenge.xlsx
success_condition: The challenge result page shows a success-rate message after 10 submissions.
safe_test_case: Public RPA Challenge fixture data only.
allowed_side_effects:
- Submit fixture challenge rows to rpachallenge.com
rerun_policy: Manual rerun only; submit steps are not automatically retried.
escalation_owner: Rau
output_destination:
  system_of_record: RPA Challenge result page and local report.html
inputs:
  target_url: https://rpachallenge.com/
steps:
- id: open_challenge
  description: Open the public RPA Challenge page.
  action:
    type: browser.goto
    url: ${inputs.target_url}
    wait_until: load
  success_check:
  - type: url_contains
    value: rpachallenge.com
  - type: visible_text
    value: RPA Challenge
  - type: selector_visible
    selector:
      strategy: role
      role: button
      name: Start
- id: start_challenge
  description: Start the timed challenge after the form is visible.
  action:
    type: browser.click
    selector:
      strategy: role
      role: button
      name: Start
  side_effect: external_read
  retryable: false
  success_check:
  - type: selector_visible
    selector:
      strategy: css
      value: input[value="Submit"]
- id: round_01_fill_first_name
  description: 'Round 1: fill First Name.'
  action:
    type: browser.fill
    selector:
      strategy: css
      value: '[ng-reflect-name="labelFirstName"]'
    value: John
  success_check:
  - type: field_has_value
    selector:
      strategy: css
      value: '[ng-reflect-name="labelFirstName"]'
- id: round_01_fill_last_name
  description: 'Round 1: fill Last Name.'
