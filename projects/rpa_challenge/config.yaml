name: rpa_challenge
log_level: INFO
report_dir: ./reports
screenshot_dir: ./screenshots
headless: false
browser: chromium
locale: en-US

variables:
  shortest_path_mode: live
  shortest_path_url: https://rpachallenge.com/assets/shortestPath/public/shortestpath.html
  shortest_path_backend_url: http://uipath509.westeurope.cloudapp.azure.com:4444/api/v1
  shortest_path_output_json: runs/rpa_challenge_shortest_path/shortest_path_report_{mode}_{timestamp}.json
  shortest_path_output_html: reports/rpa_challenge_shortest_path/shortest_path_report_{mode}_{timestamp}.html
  shortest_path_evidence_dir: runs/rpa_challenge_shortest_path/evidence
  shortest_path_recon_dir: runs/rpa_challenge_shortest_path/recon
  shortest_path_timeout_seconds: 10
  ocr_target_url: https://rpachallengeocr.azurewebsites.net/
  ocr_output_dir: runs/rpa_challenge_ocr
  ocr_output_html: reports/rpa_challenge_ocr/report_{timestamp}.html
  ocr_engine: paddle
