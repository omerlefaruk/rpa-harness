id: trip_com_reviews
name: Trip.com Reviews
version: "0.1.0"
type: mixed
description: Project descriptor for the Python RPAWorkflow in projects/trip_com_reviews/workflow.py.
owner: ops
target_systems:
  - trip.com
input_schema:
  input_excel: string
  sheet: string
output_destination: reports/trip_com_all_hotels_recent_reviews.xlsx
system_of_record: Trip.com public review pages
success_condition: The workflow writes recent review JSON and workbook artifacts.
safe_test_case: Run against a small fixture workbook.
allowed_side_effects:
  - write_report
rerun_policy: Safe to rerun after checking output files.
escalation_owner: ops
inputs:
  input_excel: data/ota_links.xlsx
  sheet: Taksim Analiz
steps:
  - id: python_workflow_entrypoint
    current_stage: execute_python_workflow
    intent: Run the project Python RPAWorkflow.
    preconditions:
      - input workbook exists
    postconditions:
      - Trip.com review report exists
    proof: projects/trip_com_reviews/tests/test_workflow.py
    failure_path: Fix project tests before production execution.
    action:
      type: no_op
    success_check:
      - type: always_pass
