id: ota_link_swarm
name: OTA Link Swarm
version: "0.1.0"
type: mixed
description: YAML workflow descriptor for projects/ota_link_swarm/workflows/main.yaml.
owner: ops
target_systems:
  - ota-public-sites
input_schema:
  input_excel: string
  sheet: string
output_destination: reports/ota_link_swarm_report.html
system_of_record: local selector evidence
success_condition: The workflow writes an aggregate selector-swarm report.
safe_test_case: Run against a small fixture workbook.
allowed_side_effects:
  - write_report
rerun_policy: Safe to rerun after checking output directories.
escalation_owner: ops
inputs:
  input_excel: data/ota_links.xlsx
  sheet: Taksim Analiz
steps:
  - id: yaml_descriptor_entrypoint
    current_stage: audit_yaml_descriptor
    intent: Run the project YAML workflow.
    preconditions:
      - input workbook exists
    postconditions:
      - selector evidence report exists
    proof: python main.py --audit-workflow projects/ota_link_swarm/workflows/main.yaml
    failure_path: Fix the YAML descriptor before production execution.
    action:
      type: no_op
    success_check:
      - type: always_pass
