[project]
name = "rpa-harness"
version = "0.1.0"
description = "AI-powered RPA automation harness with Playwright, Windows UIAutomation, and agentic AI loop"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "RPA Harness" }]

dependencies = [
    "activegraph==1.10.0",
    "pyyaml>=6.0",
    "playwright>=1.40.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "pyautogui>=0.9.54",
]

[project.scripts]
rpa-harness = "harness.cli:run"

[project.entry-points."activegraph.packs"]
rpa_automation = "harness.automation.pack:pack"

[project.optional-dependencies]
windows = [
    "pywinauto>=0.6.8",
    "pywin32>=306",
]
outlook = [
    "pywin32>=306",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-playwright>=0.5.0",
]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
"harness.templates.workspace" = [
    "README.md",
    "workflows/*.yaml",
    "config/*.yaml",
    ".agents/config/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "projects"]
addopts = "--basetemp=.pytest_tmp --import-mode=importlib"
