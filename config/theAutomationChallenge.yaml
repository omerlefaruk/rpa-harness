name: theAutomationChallenge
log_level: INFO
report_dir: ./reports
screenshot_dir: ./screenshots
headless: false
browser: chromium
locale: en-US

variables:
  automation_challenge_url: https://www.theautomationchallenge.com/
  automation_challenge_output_dir: runs/the_automation_challenge
  automation_challenge_output_html: reports/the_automation_challenge/report_{timestamp}.html

memory:
  enabled: true
  worker_url: http://127.0.0.1:37777
  db_path: ./data/rpa_memory.db
  required: false
  project: rpa-harness
  request_timeout_seconds: 2
  semantic_inject: false
  semantic_inject_limit: 5
