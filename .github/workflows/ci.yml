name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Compile
        run: python -m compileall -q harness tests main.py conftest.py

      - name: Unit tests
        run: python -m pytest -q

      - name: ActiveGraph automation contracts
        run: |
          python -m pytest -q tests/test_automation_*.py tests/test_workspace_runtime.py
          python -m harness.cli --automation-list-operations

  agent-package:
    name: Agent package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: MCP allowlist tests
        working-directory: packages/rpa-harness-agent
        run: npm test
