name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Compile
        run: python -m compileall -q harness tools tests main.py conftest.py

      - name: Unit tests
        run: python -m pytest -q

      - name: Validate capability workflows
        run: |
          python main.py --validate-yaml workflows/capabilities/local_browser_form.yaml
          python main.py --validate-yaml workflows/capabilities/local_api_read.yaml
          python main.py --validate-yaml workflows/capabilities/local_api_write.yaml

  browser-integration:
    name: Browser integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m playwright install --with-deps chromium

      - name: Browser capability tests
        env:
          RPA_RUN_INTEGRATION: "1"
        run: python -m pytest -q tests/test_yaml_runner_integration.py tests/capabilities/test_yaml_browser_runtime.py
