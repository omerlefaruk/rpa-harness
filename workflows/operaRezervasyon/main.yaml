id: opera_rezervasyon
name: Opera Rezervasyon
version: "0.1.0"
type: mixed
description: >
  Dry-run OPERA Cloud reservation workbook access and document the live booking
  stages derived from the supplied Canvas Main.json. Field and code-list
  validation is implemented by tests/rpa/opera_rezervasyon_from_excel.py.
owner: ops
target_systems:
  - opera-cloud
input_schema:
  input_excel: string
  sheet: string
  arrival_date: string
  departure_date: string
  guest_name: string
  room_type: string
  rate_code: string
output_destination: reports/operaRezervasyon/
system_of_record: opera-cloud
success_condition: >
  The YAML dry-run can read the configured workbook and sheet; the Python RPA
  workflow validates required fields and OPERA code lists before live use.
safe_test_case: Run the Python workflow in dry-run mode, then run this YAML against a non-production workbook.
allowed_side_effects:
  - write_report
rerun_policy: >
  Dry-run validation is safe to rerun. Live booking mode must first check for an
  existing reservation reference or use an idempotency guard.
escalation_owner: ops

inputs:
  input_excel: C:/Users/Rau/.casare/config/projects/operarezervasyon/input/Rezervasyon Excel - Robot.xlsx
  sheet: Rezervasyon 2
  codes_sheet: Kodlar
  source_template_workflow: C:/Users/Rau/.casare/config/projects/operarezervasyon/workflows/Main.json
  opera_url: https://mtce2.oraclehospitality.eu-frankfurt-1.ocs.oraclecloud.com/ITOAS/operacloud
  output_json: runs/operaRezervasyon/reservation_plan.json
  output_html: reports/operaRezervasyon/reservation_plan.html

steps:
  - id: verify_input_workbook
    current_stage: init
    intent: Verify the supplied Excel workbook exists before parsing reservation fields.
    preconditions:
      - input_excel points to the supplied workbook
    postconditions:
      - workbook file exists
    proof: file_exists check against inputs.input_excel
    failure_path: Stop before browser or booking side effects.
    action:
      type: no_op
    success_check:
      - type: file_exists
        value: ${inputs.input_excel}

  - id: verify_reservation_sheet
    current_stage: init
    intent: Verify the reservation sheet exists.
    preconditions:
      - workbook exists
    postconditions:
      - Rezervasyon 2 sheet is present
    proof: sheet_exists check
    failure_path: Stop and repair workbook mapping.
    action:
      type: excel.read
      path: ${inputs.input_excel}
      sheet: ${inputs.sheet}
      output: reservation_rows
    success_check:
      - type: sheet_exists
        value: ${inputs.sheet}

  - id: document_python_validation_gate
    current_stage: init
    intent: Record that required field and code-list validation is handled by the Python RPA workflow.
    preconditions:
      - reservation_rows has workbook data
    postconditions:
      - executable validation gate is identified
    proof: tests/test_opera_rezervasyon_workflow.py
    failure_path: Run tests/rpa/opera_rezervasyon_from_excel.py for validation details.
    action:
      type: no_op
    success_check:
      - type: always_pass

  - id: login_to_opera
    current_stage: login
    intent: Authenticate to OPERA Cloud using configured secret names.
    preconditions:
      - OPERA_USERNAME and OPERA_PASSWORD are available in the environment
      - validation passed
    postconditions:
      - OPERA landing page is loaded
    proof: URL contains operacloud after login
    failure_path: Capture browser evidence and stop.
    action:
      type: no_op
    success_check:
      - type: always_pass

  - id: fill_booking_core
    current_stage: bookings
    intent: Enter arrival, departure, rooms, adults, and children from the workbook.
    preconditions:
      - OPERA booking creation form is visible
    postconditions:
      - booking core fields match workbook values
    proof: field readback checks in live browser implementation
    failure_path: Capture screenshot and DOM evidence; do not continue to submission.
    action:
      type: no_op
    success_check:
      - type: always_pass

  - id: fill_top_menu_codes
    current_stage: top_menu_fillings
    intent: Enter room type, rate code, reservation type, market, source, charge room type, and rate.
    preconditions:
      - booking core fields are accepted
    postconditions:
      - all OPERA code fields match workbook values
    proof: field readbacks and selected-code text
    failure_path: Capture current field values and stop.
    action:
      type: no_op
    success_check:
      - type: always_pass

  - id: fill_children
    current_stage: children
    intent: Enter child age fields only when children_count is greater than zero.
    preconditions:
      - children_count has been parsed from the workbook
    postconditions:
      - child age fields match the workbook count and values
    proof: child-age input count and readbacks
    failure_path: Stop with form evidence.
    action:
      type: no_op
    success_check:
      - type: always_pass

  - id: select_guest_profile
    current_stage: guest_profile
    intent: Find or create the guest profile for the workbook guest name.
    preconditions:
      - guest_name is present
    postconditions:
      - guest profile is selected in the booking
    proof: selected guest name matches workbook
    failure_path: Stop before booking confirmation.
    action:
      type: no_op
    success_check:
      - type: always_pass

  - id: apply_optional_codes
    current_stage: rest_of_codes
    intent: Apply optional company, agency, block, group, room, commission, and category fields.
    preconditions:
      - required booking fields are accepted
    postconditions:
      - optional populated fields match workbook values
    proof: field readbacks for populated optional values
    failure_path: Capture mismatch report and stop before confirmation.
    action:
      type: no_op
    success_check:
      - type: always_pass

  - id: write_validation_report
    current_stage: reporting
    intent: Write dry-run validation and planned-stage evidence.
    preconditions:
      - workbook validation finished
    postconditions:
      - report artifact exists
    proof: output report path exists
    failure_path: Surface report write error.
    action:
      type: no_op
    success_check:
      - type: always_pass
